<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShotCat 截图上镜猫</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="4" y="4" width="56" height="56" rx="18" fill="#171b22"/>
        <path d="M12 29 17 12l13 11q6-3 13 0l11-11 5 18q4 5 4 12 0 17-31 17T1 42q0-7 11-13Z" fill="#f4cb58"/>
        <circle cx="23" cy="40" r="5" fill="#171b22"/><circle cx="42" cy="40" r="5" fill="#171b22"/>
        <path d="M29 49q4-3 8 0-4 5-8 0Z" fill="#f29a91"/>
      </svg>
    </div>
    <div><b>ShotCat</b><span>截图上镜猫 · 喵造实验室 012 · v0.2</span></div>
  </div>
  <div class="privacy">纯本地 · 截图不上传</div>
</header>

<main class="layout">
<aside class="controls">
  <section class="card intro">
    <span class="eyebrow">SCREENSHOT → PROMO</span>
    <h1>截图只是素材，<br><em>宣传图才是结果。</em></h1>
    <p>v0.2 新增「宣传图模式」：大标题、卖点标签、软件截图和品牌角标，一张图直接拿去发。</p>
    <button id="chooseBtn" class="primary">选择截图</button>
  </section>

  <section class="card mode-card">
    <div class="titlebar"><span>00</span><b>制作模式</b></div>
    <div class="mode-switch" id="modeSwitch">
      <button data-mode="promo" class="active">宣传图模式<small>推荐</small></button>
      <button data-mode="beautify">自由美化<small>v0.1</small></button>
    </div>
  </section>

  <section class="card">
    <div class="titlebar"><span>01</span><b>画布尺寸</b></div>
    <div class="grid presets">
      <button data-preset="xhs34" class="active">小红书<small>1080×1440</small></button>
      <button data-preset="square">方图<small>1080×1080</small></button>
      <button data-preset="video169">16:9<small>1920×1080</small></button>
      <button data-preset="story916">9:16<small>1080×1920</small></button>
      <button data-preset="readme">README<small>1600×900</small></button>
    </div>
  </section>

  <section class="card">
    <div class="titlebar"><span>02</span><b>视觉风格</b></div>
    <div class="grid themes">
      <button data-theme="mint" class="mint active">Mint</button>
      <button data-theme="dark" class="dark">Dark</button>
      <button data-theme="sunset" class="sunset">Sunset</button>
      <button data-theme="lavender" class="lavender">Lavender</button>
      <button data-theme="cream" class="cream">Cream</button>
      <button data-theme="minimal" class="minimal">Minimal</button>
    </div>
  </section>

  <section class="card promo-only" id="promoCard">
    <div class="titlebar"><span>03</span><b>宣传文案</b></div>
    <label>产品名<input id="productName" value="ShotCat 截图上镜猫"></label>
    <label>顶部角标<input id="kicker" value="喵造实验室 012 · WINDOWS"></label>
    <label>主标题<input id="promoTitle" value="截图太素？让猫给它化个妆。"></label>
    <label>副标题<input id="promoSubtitle" value="拖进截图，一键生成能直接发的小红书宣传图"></label>
    <div class="chip-inputs">
      <label>卖点 1<input id="chip1" value="一键美化"></label>
      <label>卖点 2<input id="chip2" value="小红书 3:4"></label>
      <label>卖点 3<input id="chip3" value="本地处理"></label>
    </div>
    <label>右上徽章<input id="badgeText" value="NEW · v0.2"></label>
    <label class="toggle"><input id="showBrand" type="checkbox" checked> 显示「喵造实验室」角标</label>
  </section>

  <section class="card beautify-only hidden" id="beautifyCard">
    <div class="titlebar"><span>03</span><b>自由标题</b></div>
    <label>主标题<input id="mainTitle" value="截图太素？让猫给它化个妆。"></label>
    <label>副标题<input id="subtitle" value="ShotCat · 一键生成好看的分享图"></label>
    <label class="toggle"><input id="showTitle" type="checkbox" checked> 显示标题区</label>
  </section>

  <section class="card">
    <div class="titlebar"><span>04</span><b>截图细节</b></div>
    <label class="toggle"><input id="windowFrame" type="checkbox" checked> 模拟窗口标题栏</label>
    <label>留白 <span id="paddingValue">90</span><input id="padding" type="range" min="30" max="180" value="90"></label>
    <label>截图圆角 <span id="radiusValue">30</span><input id="radius" type="range" min="0" max="70" value="30"></label>
    <label>阴影 <span id="shadowValue">55</span><input id="shadow" type="range" min="0" max="100" value="55"></label>
    <label>截图缩放 <span id="scaleValue">100%</span><input id="scale" type="range" min="60" max="110" value="100"></label>
  </section>

  <section class="card">
    <button id="exportBtn" class="primary wide" disabled>导出 PNG</button>
    <button id="openBtn" class="secondary wide" hidden>打开导出位置</button>
    <small class="note">导出使用完整像素，不是界面预览截图。</small>
  </section>
</aside>

<section class="stage">
  <div class="stage-head">
    <div><small id="previewMode">宣传图实时预览</small><b id="stageSize">1080 × 1440</b></div>
    <span id="sourceName">还没有选择截图</span>
  </div>
  <div class="stage-shell">
    <canvas id="canvas" width="1080" height="1440"></canvas>
    <div id="empty" class="empty">
      <svg viewBox="0 0 120 100" aria-hidden="true">
        <path d="M22 42 29 10l25 21q12-5 25 0l24-21 8 34q10 10 10 25 0 31-61 31T0 69q0-15 22-27Z" fill="#171b22"/>
        <ellipse cx="42" cy="68" rx="12" ry="15" fill="#f4cb58"/><ellipse cx="78" cy="68" rx="12" ry="15" fill="#f4cb58"/>
        <circle cx="45" cy="70" r="5"/><circle cx="75" cy="70" r="5"/>
      </svg>
      <b>先给猫一张截图</b><span>支持 PNG / JPG / WEBP</span>
      <button id="emptyChooseBtn" class="secondary">选择截图</button>
    </div>
  </div>
  <div class="tips"><span>✓ 大标题</span><span>✓ 卖点标签</span><span>✓ 品牌角标</span><span>✓ 原图不修改</span></div>
</section>
</main>
</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
